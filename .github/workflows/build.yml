name: Build Siample

# Compile Siample à chaque envoi de code sur la branche principale,
# ou à la demande (onglet Actions > Build Siample > Run workflow).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-latest }
          - { name: Windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v7

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build --config Release --parallel 4

      # Contrôle automatique du plugin. Un échec ici n'empêche pas de récupérer le plugin,
      # mais le journal de cette étape aide à trouver les bugs.
      - name: Contrôler le plugin (pluginval)
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pluginval.zip
            PLUGINVAL="./pluginval.app/Contents/MacOS/pluginval"
          else
            curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pluginval.zip
            PLUGINVAL="./pluginval.exe"
          fi
          "$PLUGINVAL" --strictness-level 5 --validate-in-process --validate "build/Siample_artefacts/Release/VST3/Siample.vst3"

      - name: Préparer l'archive (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Siample-macOS
          cp -R build/Siample_artefacts/Release/VST3/Siample.vst3      dist/Siample-macOS/
          cp -R build/Siample_artefacts/Release/AU/Siample.component   dist/Siample-macOS/
          cp -R build/Siample_artefacts/Release/Standalone/Siample.app dist/Siample-macOS/
          cp packaging/macOS/LISEZMOI.txt packaging/macOS/installer.sh dist/Siample-macOS/
          # Signature locale (« ad hoc ») : indispensable sur les Mac Apple Silicon
          codesign --force --deep --sign - dist/Siample-macOS/Siample.vst3
          codesign --force --deep --sign - dist/Siample-macOS/Siample.component
          codesign --force --deep --sign - dist/Siample-macOS/Siample.app
          # ditto conserve les droits d'exécution et la structure des bundles
          cd dist && ditto -c -k --keepParent Siample-macOS ../Siample-macOS.zip

      - name: Préparer l'archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Siample-Windows | Out-Null
          Copy-Item -Recurse build/Siample_artefacts/Release/VST3/Siample.vst3 dist/Siample-Windows/
          Copy-Item build/Siample_artefacts/Release/Standalone/Siample.exe dist/Siample-Windows/
          Copy-Item packaging/Windows/LISEZMOI.txt dist/Siample-Windows/
          Compress-Archive -Path dist/Siample-Windows -DestinationPath Siample-Windows.zip

      - name: Publier l'archive
        uses: actions/upload-artifact@v7
        with:
          path: Siample-${{ matrix.name }}.zip
          archive: false
          if-no-files-found: error
